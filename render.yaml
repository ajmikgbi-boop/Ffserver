# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard > New > Blueprint > pick this repository. You will be asked for the
# four R2 secrets (sync: false means "enter in the dashboard, never stored in git").
services:
  - type: web
    name: companysync-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: ALLOWED_SERVER_CODES
        sync: false
